name: Inspect Rutgers court search
on:
  push:
    branches: [nj-tax-opinion-index]
    paths: [.github/workflows/inspect-rutgers.yml]
  pull_request:
    paths: [.github/workflows/inspect-rutgers.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public search page
        run: |
          mkdir -p output/rutgers-inspect
          curl -k -L --max-time 90 -A 'Mozilla/5.0' -D output/rutgers-inspect/headers.txt 'https://njlaw.rutgers.edu/courts/' -o output/rutgers-inspect/courts.html 2> output/rutgers-inspect/curl-error.txt || true
          grep -inE '<form|<input|<select|<option|<script' output/rutgers-inspect/courts.html > output/rutgers-inspect/forms.txt || true
          wc -c output/rutgers-inspect/* || true
          cat output/rutgers-inspect/headers.txt || true
          head -200 output/rutgers-inspect/forms.txt || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rutgers-search-inspect
          path: output/rutgers-inspect/
          retention-days: 3
